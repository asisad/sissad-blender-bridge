name: tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - run: uv sync --frozen
      - run: uv run pytest -q --basetemp .runtime/pytest
      - run: uv build
